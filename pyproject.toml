[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG with self-correction over a private document corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.14",
    "structlog>=24.4",
    "httpx>=0.28.1",
    "pymupdf>=2.1",
    "fastembed>=0.6",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
rag = "agentic_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Payload indexes have no effect:UserWarning", "ignore:Failed to obtain server version:UserWarning"]
markers = ["integration: needs running services (docker compose up)"]
