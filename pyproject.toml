[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG with self-correction over a private document corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.14",
    "structlog>=24.4",
    "httpx>=0.28.1",
    "pymupdf>=2.1",
    "fastembed>=0.6",
    "beautifulsoup4>=4.15.0",
    "langgraph>=1.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
rag = "agentic_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "import-linter>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates read better unwrapped.
"src/agentic_rag/pipelines/prompts.py" = ["E501"]
"src/agentic_rag/pipelines/agent/prompts.py" = ["E501"]
"src/agentic_rag/guardrails/injection.py" = ["E501"]  # regexes read better unbroken
"src/agentic_rag/evaluation/synth.py" = ["E501"]
"src/agentic_rag/evaluation/judge.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["test_loaders"]
disallow_untyped_calls = false  # pymupdf (used to build fixture PDFs) ships no type hints

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test helpers (fakes.py)
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Payload indexes have no effect:UserWarning", "ignore:Failed to obtain server version:UserWarning"]
markers = ["integration: needs running services (tests/integration/, run `make up` first)"]

# Architecture rules (docs/ARCHITECTURE.md). `make lint` fails if an import breaks them.
[tool.importlinter]
root_package = "agentic_rag"

[[tool.importlinter.contracts]]
name = "Layered architecture: modules only import from layers below"
type = "layers"
layers = [
    "agentic_rag.api | agentic_rag.cli",
    "agentic_rag.factory",
    "agentic_rag.evaluation",
    "agentic_rag.pipelines",
    "agentic_rag.ingestion | agentic_rag.retrieval",
    "agentic_rag.indexing | agentic_rag.llm | agentic_rag.guardrails",
    "agentic_rag.domain",
    "agentic_rag.core",
]

[[tool.importlinter.contracts]]
name = "Only the composition root and entrypoints construct concrete providers"
type = "forbidden"
source_modules = ["agentic_rag.pipelines", "agentic_rag.retrieval", "agentic_rag.evaluation"]
forbidden_modules = ["agentic_rag.llm.ollama", "agentic_rag.indexing.fastembed"]
